# Publishes the page to GitHub Pages. The page needs no server: it reads the exchanges' public feeds from the visitor's browser.
# Nothing here runs until the repository is pushed to GitHub and Pages is set to "GitHub Actions" in the repository settings.
name: Pages

on:
  push:
    branches: [master]
  # Once a day the coin list is rebuilt from the markets' lists and the site published again with it (GitHub stops a schedule after
  # 60 days without a push to the repository; a push or a manual run starts it again).
  schedule:
    - cron: '17 3 * * *'
    # Just after midnight UTC, so the put-flow history (below) holds yesterday soon after it ends: a page can read only the last 24 hours of
    # option trades itself (www.deribit.com), and fills in from the history's last day.
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typechecks the three projects, then builds the page with relative URLs (it works under /<repository>/) and no source maps.
      - run: npm run build:site
        env:
          HLM_SOURCEMAP: 'off'
      # The coin list (src/shared/coins.ts): a market whose list cannot be read from here (some exchanges refuse US addresses, where the
      # runners are) keeps its listings from the list the site has now; the copy in the repository stands in if that cannot be read.
      # A failure here never stops the deploy: the copy built into dist stays.
      - run: npm run build:tools && node build/tools/scripts/coins.mjs --previous https://${{ github.repository_owner }}.github.io/coins.json --fallback src/app/public/coins.json --out dist/coins.json
        continue-on-error: true
      # The put-flow history (put-flow.json, the Put flow tab): each UTC day's premium paid by aggressive buyers of Deribit BTC options,
      # puts and calls apart, read from history.deribit.com, which a page cannot read (it sends no CORS header). Only the days after the
      # published file's last are read; the copy in the repository stands in if the published one cannot be read. A failure never stops
      # the deploy: the copy built into dist stays, and the page says through which day its history goes.
      - run: npm run build:tools && node build/tools/scripts/put-flow.mjs --previous https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/put-flow.json --fallback src/app/public/put-flow.json --out dist/put-flow.json
        continue-on-error: true
        timeout-minutes: 20
      # The positioning archive (positioning.json, the Positioning tab): BTCUSDT daily open interest and 7-day funding, and the alt
      # negative-funding share, from Binance's public API. Only the days after the published file's last are added; the copy in the
      # repository stands in if the published one cannot be read. A failure never stops the deploy: the copy built into dist stays.
      - run: npm run build:tools && node build/tools/scripts/positioning.mjs --previous https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/positioning.json --fallback src/app/public/positioning.json --out dist/positioning.json
        continue-on-error: true
        timeout-minutes: 20
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
